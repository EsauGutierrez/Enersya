<!DOCTYPE html>
<html lang="es">

<head>

    <title>Mensaje Enviado | ENERSYA</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <header class="bg-white shadow-sm w-full">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-3xl font-bold text-blue-900 mb-3">¡Mensaje enviado!</h1>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="index.html"

                    class="border border-blue-900 text-blue-900 font-bold px-8 py-3 rounded-lg hover:bg-blue-50 transition">

                </a>

    <footer class="bg-gray-900 text-gray-400 py-6">
